[project]
name = "urlshortener-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "redis>=5.2",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "fakeredis>=2.26", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
