name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint backend
        working-directory: backend
        run: uv sync --frozen && .venv/bin/ruff check app tests

      - name: Install & lint frontend
        working-directory: frontend
        run: npm ci && npx oxlint src && npm run build

      - name: Run tests (writes results/)
        run: ./scripts/run_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build images and smoke-test the stack
        run: |
          echo "POSTGRES_PASSWORD=ci-only" > .env
          docker compose up -d --build --wait --wait-timeout 120
          code=$(curl -fsS -XPOST localhost:8080/api/v1/links \
            -H 'Content-Type: application/json' -d '{"url":"https://example.com"}' | jq -r .code)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/$code)" = 302
          curl -fsS localhost:8080/ > /dev/null
      - if: failure()
        run: docker compose logs
