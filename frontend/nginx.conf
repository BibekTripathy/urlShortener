# Reuse connections to the API instead of opening one per request
# (without this, load exhausts ephemeral ports → 502s).
upstream api {
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /favicon.svg { expires 7d; }

    # everything API-side: REST, health, docs, and short codes
    location ~ "^/(api/|healthz$|docs$|openapi\.json$|[A-Za-z0-9_-]{3,32}$)" {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /index.html; }
}
